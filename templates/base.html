<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SGTCC - UFAC</title>
    <style>
        /* CSS básico para deixar parecido com o seu protótipo (Azul da UFAC) */
        body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; }
        .sidebar { width: 250px; background-color: #2b3990; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; margin-bottom: 40px; }
        .sidebar a { color: white; text-decoration: none; display: block; margin-bottom: 20px; font-weight: bold; }
        .sidebar a:hover { color: #facc22; }
        .content { flex-grow: 1; padding: 30px; background-color: #f4f5f7; }
        .footer-menu { margin-top: auto; } /* Joga o botão sair pro final */
    </style>
</head>
<body>
    
    <div class="sidebar">
        <h2>UFAC<br>SGTCC</h2>
        <a href="{% url 'dashboard' %}">VISUALIZAR BANCAS</a>
        <a href="{% url 'solicitar_banca' %}">SOLICITAR BANCA</a>
        <a href="#">DOCUMENTOS</a>
        
        <div class="footer-menu">
            <a href="#">SAIR 🚪</a>
        </div>
    </div>

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>

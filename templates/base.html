{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>SGTCC - UFAC</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    
    <div class="sidebar">
        <h2>UFAC<br>SGTCC</h2>
        <!-- Menu corrigido e sem duplicatas -->
        <a href="{% url 'dashboard' %}">INÍCIO / PAINEL</a>
        <a href="{% url 'visualizar_bancas' %}">VISUALIZAR BANCAS</a>
        <a href="{% url 'solicitar_banca' %}">SOLICITAR BANCA</a>
        <a href="{% url 'cadastrar_aluno' %}">CADASTRAR ALUNO</a>
        <a href="{% url 'cadastrar_projeto' %}">CADASTRAR PROJETO</a>
        <a href="{% url 'meus_tccs' %}">BANCAS CADASTRADAS</a>
        <a href="{% url 'documentos' %}">DOCUMENTOS</a>
        
        <div class="footer-menu">
            <a href="#">SAIR</a>
        </div>
    </div>

    <div class="content">
        {% if messages %}
            <div class="mensagens-container">
                {% for message in messages %}
                    <!-- A tag message.tags puxa se é success, warning ou error -->
                    <div class="alerta alerta-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

            <form action="{% url 'pesquisar' %}" method="GET" class="barra-pesquisa">
                <input
                    type="text"
                    name="q"
                    placeholder="Pesquisar discente ou TCC..."
                    value="{{ request.GET.q }}"
                >
                <button type="submit">Pesquisar</button>
            </form>

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>

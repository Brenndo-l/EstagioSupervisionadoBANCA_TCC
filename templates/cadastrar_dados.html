{% extends 'base.html' %}

{% block content %}

<div class="dashboard-header shared-page-hero">
    <span class="shared-page-eyebrow">Cadastro no sistema</span>
    <h1>{{ titulo }}</h1>
    <p>Preencha os dados abaixo para registrar no sistema.</p>
</div>

<section class="shared-card shared-card--form-narrow shared-card--accent">
    <div class="shared-card-header">
        <span class="shared-card-kicker">Novo registro</span>
        <h2>Informações do cadastro</h2>
        <p>Confira os dados informados antes de concluir.</p>
    </div>

    <form method="POST" class="shared-form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-enviar">Salvar Cadastro</button>
    </form>
</section>

{% endblock %}

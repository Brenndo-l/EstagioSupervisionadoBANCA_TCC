{% extends 'base.html' %}

{% block content %}
    <h1>Painel de Controle</h1>
    <p>Resumo do Sistema de Gerenciamento de Bancas de TCC.</p>

    <div class="dashboard-cards">
        <div class="card">
            <h3>Bancas Agendadas</h3>
            <p>{{ qtd_bancas }}</p>
        </div>
        
        <div class="card">
            <h3>Solicitações Pendentes</h3>
            <p>{{ qtd_solicitacoes }}</p>
        </div>

        <div class="card">
            <h3>Salas Disponíveis</h3>
            <p>{{ qtd_salas }}</p>
        </div>
    </div>
{% endblock %}

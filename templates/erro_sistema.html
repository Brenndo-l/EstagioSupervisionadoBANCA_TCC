{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#172554">

    <title>{{ codigo_erro }} | SGTCC</title>

    <link
        rel="icon"
        type="image/png"
        href="{% static 'assets/logo_ufac.png' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}?v=20260902-01"
    >
</head>

<body class="erro-sistema-pagina">

    <main class="erro-sistema-card" id="conteudo-principal">

        <img
            class="erro-sistema-logo"
            src="{% static 'assets/logo_ufac.png' %}"
            alt="Brasão da Universidade Federal do Acre"
        >

        <span class="erro-sistema-marca">SGTCC · UFAC</span>

        <strong class="erro-sistema-codigo">
            {{ codigo_erro }}
        </strong>

        <h1>{{ titulo_erro }}</h1>

        <p>{{ mensagem_erro }}</p>

        {% if request.user.is_authenticated %}
            <a class="btn-primario" href="{% url 'dashboard' %}">
                Voltar ao painel
            </a>
        {% else %}
            <a class="btn-primario" href="{% url 'login' %}">
                Voltar ao acesso
            </a>
        {% endif %}

    </main>

</body>
</html>

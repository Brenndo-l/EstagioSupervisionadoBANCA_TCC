<div
    class="date-time-control"
    data-date-time-group
    data-date-time-role="{{ widget.papel }}"
>
    <label class="date-time-part">
        <span>Data</span>
        {% include widget.subwidgets.0.template_name with widget=widget.subwidgets.0 %}
    </label>

    <label class="date-time-part date-time-part--time">
        <span>Hora</span>
        {% include widget.subwidgets.1.template_name with widget=widget.subwidgets.1 %}
    </label>
</div>
